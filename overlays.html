<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Overlays | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-overlays">

    <div class="glow-container"></div>

    <header class="main-nav">
        <a href="index.html" class="logo-link">
            <div class="logo"><img src="assets/images/logo.png" alt="My Brand Logo"></div>
        </a>
        <nav>
            <a href="showroom.html">Showroom</a>
            <a href="overlays.html">Free Overlays</a>
            <a href="custom.html" class="nav-cta">Custom Request</a>
        </nav>
    </header>

    <main class="section-container">
        <div class="header-img-container">
            <img src="assets/images/Free.png" alt="Free Watermarked Layouts" class="header-img">
        </div>

        <section id="ps5" class="platform-section">
            <h2 class="platform-title">PS5</h2>
            <div class="showroom-grid">
                <div class="product-card">
                    <img src="assets/images/custom4daez-ps5.png" alt="Custom4daez PS5">
                    <div class="card-info">
                        <h3>C4D PS5 Edition</h3>
                        <p class="price">FREE</p>
                        <button class="unlock-btn">GRAB CONTROLLER</button>
                    </div>
                </div>
                <div class="product-card">
                    <img id="ps5-display" src="assets/images/ps5-white.png" alt="Selectable PS5 Controller">
                    <div class="card-info">
                        <h3>Selectable Color PS5</h3>
                        <div class="color-selector">
                            <button onclick="changeColor('ps5', 'white')" class="color-dot" style="background: white;"></button>
                            <button onclick="changeColor('ps5', 'black')" class="color-dot" style="background: black;"></button>
                            <button onclick="changeColor('ps5', 'blue')" class="color-dot" style="background: blue;"></button>
                            <button onclick="changeColor('ps5', 'red')" class="color-dot" style="background: red;"></button>
                            <button onclick="changeColor('ps5', 'green')" class="color-dot" style="background: green;"></button>
                        </div>
                        <button class="unlock-btn">GRAB CONTROLLER</button>
                    </div>
                </div>
            </div> 
        </section>

        <section id="xbox" class="platform-section">
            <h2 class="platform-title">XBOX SERIES X/S</h2>
            <div class="showroom-grid">
                <div class="product-card">
                    <img src="assets/images/xbox-default.png" alt="XBOX Product">
                    <div class="card-info">
                        <h3>C4D XBOX Edition</h3>
                        <p class="price">FREE</p>
                        <button class="unlock-btn">GRAB CONTROLLER</button>
                    </div>
                </div>
                <div class="product-card">
                    <img id="xbox-display" src="assets/images/xbox-white.png" alt="Selectable XBOX Controller">
                    <div class="card-info">
                        <h3>Selectable Color XBOX</h3>
                        <div class="color-selector">
                            <button onclick="changeColor('xbox', 'white')" class="color-dot" style="background: white;"></button>
                            <button onclick="changeColor('xbox', 'black')" class="color-dot" style="background: black;"></button>
                            <button onclick="changeColor('xbox', 'blue')" class="color-dot" style="background: blue;"></button>
                            <button onclick="changeColor('xbox', 'red')" class="color-dot" style="background: red;"></button>
                            <button onclick="changeColor('xbox', 'green')" class="color-dot" style="background: green;"></button>
                        </div>
                        <button class="unlock-btn">GRAB CONTROLLER</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="ps4" class="platform-section">
            <h2 class="platform-title">PS4</h2>
            <div class="showroom-grid">
                <div class="product-card">
                    <img src="assets/images/ps4-default.png" alt="PS4 Product">
                    <div class="card-info">
                        <h3>C4D PS4 Edition</h3>
                        <p class="price">FREE</p>
                        <button class="unlock-btn">GRAB CONTROLLER</button>
                    </div>
                </div>
                <div class="product-card">
                    <img id="ps4-display" src="assets/images/ps4-white.png" alt="Selectable PS4 Controller">
                    <div class="card-info">
                        <h3>Selectable Color PS4</h3>
                        <div class="color-selector">
                            <button onclick="changeColor('ps4', 'white')" class="color-dot" style="background: white;"></button>
                            <button onclick="changeColor('ps4', 'black')" class="color-dot" style="background: black;"></button>
                            <button onclick="changeColor('ps4', 'blue')" class="color-dot" style="background: blue;"></button>
                            <button onclick="changeColor('ps4', 'red')" class="color-dot" style="background: red;"></button>
                            <button onclick="changeColor('ps4', 'green')" class="color-dot" style="background: green;"></button>
                        </div>
                        <button class="unlock-btn">GRAB CONTROLLER</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Only the color-swapping function remains
        function changeColor(platform, color) {
            const displayImg = document.getElementById(`${platform}-display`);
            if (displayImg) { displayImg.src = `assets/images/${platform}-${color}.png`; }
        }
    </script>
    <script src="js/embers.js"></script>
</body>
</html>
