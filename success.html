<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Overlay Brief | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-nav">
        <a href="index.html" class="logo-link">
            <div class="logo">
                <img src="assets/images/logo.png" alt="My Brand Logo">
            </div>
        </a>
        <nav>
            <a href="showroom.html">Showroom</a>
            <a href="overlays.html">Free Overlays</a>
            <a href="custom.html" class="nav-cta">Custom Request</a>
        </nav>
    </header>

    <main class="form-container">
        <h1>COMMISSION A <span class="text-accent">CUSTOM</span> DESIGN</h1>
        <p class="form-intro">Fill out the design brief below.</p>

        <form id="brief-form" action="https://formspree.io/f/mdajwzky" method="POST" class="brief-form">
            <!-- No _next needed here, the script handles it -->
            
            <div class="form-group">
                <label for="streamer-name">Twitch / Kick / YouTube Name</label>
                <input type="text" id="streamer-name" name="streamer_name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="details">Specific Design Details</label>
                <textarea id="details" name="details" rows="6" required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Submit Design Brief</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("brief-form");
        async function handleSubmit(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(() => {
                // This redirect triggers immediately after the background submit
                window.location.href = "success.html";
            }).catch(() => {
                alert("Oops! There was a problem submitting your form.");
            });
        }
        form.addEventListener("submit", handleSubmit);
    </script>
</body>
</html>
