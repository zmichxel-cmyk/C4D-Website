<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="glow-container"></div>
    <div class="ember-container" id="ember-container"></div>

    <header class="main-nav">
        <a href="index.html" class="logo-link">
            <div class="logo">
                <img src="assets/images/logo.png" alt="My Brand Logo">
            </div>
        </a>
        
        <nav>
            <a href="showroom.html">Showroom</a>
            <a href="overlays.html">Free Overlays</a>
            <a href="custom.html" class="nav-cta">Custom Request</a>
        </nav>
    </header>

    <main class="section-container">
        <div class="showroom-logo-container">
            <img src="assets/images/showroom.png" alt="The Premium Showroom" class="showroom-logo-img">
        </div>

        <section class="platform-section">
            <h2 class="platform-title">PS5</h2>
            <div class="showroom-grid" id="ps5-grid">
                <div class="product-card">
                    <img src="assets/images/ps5-1.png" alt="Neon Storm">
                    <div class="card-info">
                        <div class="card-text">
                            <h3>NEON STORM PS5</h3>
                            <p class="price">$39.99</p>
                        </div>
                        <button class="unlock-btn">Unlock Code</button>
                    </div>
                </div>
            </div>
            
            <div id="ps5-more" style="display: none;">
                <div class="showroom-grid" style="margin-top: 20px;"></div>
            </div>

            <div class="see-more-container" onclick="toggleMore('ps5-more', this)">
                <div class="see-more-text">SEE MORE</div>
                <div class="arrow-container"></div>
            </div>
        </section>

        <section class="platform-section">
            <h2 class="platform-title">XBOX SERIES X/S</h2>
            <div class="showroom-grid" id="xbox-grid">
                </div>
            
            <div id="xbox-more" style="display: none;">
                <div class="showroom-grid" style="margin-top: 20px;"></div>
            </div>

            <div class="see-more-container" onclick="toggleMore('xbox-more', this)">
                <div class="see-more-text">SEE MORE</div>
                <div class="arrow-container"></div>
            </div>
        </section>

        <section class="platform-section">
            <h2 class="platform-title">PS4</h2>
            <div class="showroom-grid" id="ps4-grid">
                </div>

            <div id="ps4-more" style="display: none;">
                <div class="showroom-grid" style="margin-top: 20px;"></div>
            </div>

            <div class="see-more-container" onclick="toggleMore('ps4-more', this)">
                <div class="see-more-text">SEE MORE</div>
                <div class="arrow-container"></div>
            </div>
        </section>

        <section class="platform-section">
            <h2 class="platform-title">PC (MKB)</h2>
            <div class="showroom-grid" id="pc-grid">
                </div>

            <div id="pc-more" style="display: none;">
                <div class="showroom-grid" style="margin-top: 20px;"></div>
            </div>

            <div class="see-more-container" onclick="toggleMore('pc-more', this)">
                <div class="see-more-text">SEE MORE</div>
                <div class="arrow-container"></div>
            </div>
        </section>
    </main>

    <script>
        // Unlock button functionality
        document.querySelectorAll('.unlock-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('active');
                this.innerText = this.classList.contains('active') ? 'Code Unlocked' : 'Unlock Code';
            });
        });

        // Fixed "See More" functionality
        function toggleMore(id, container) {
            const section = document.getElementById(id);
            const text = container.querySelector('.see-more-text');
            const arrow = container.querySelector('.arrow-container'); // Targets the arrow div
            
            if (section.style.display === "none" || section.style.display === "") {
                section.style.display = "block";
                text.innerText = "SHOW LESS";
                arrow.classList.add('active'); // Now adds class to the arrow
            } else {
                section.style.display = "none";
                text.innerText = "SEE MORE";
                arrow.classList.remove('active'); // Removes class from the arrow
            }
        }
    </script>
    <script src="js/embers.js"></script>
</body>
</html>
