<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Overlays | Customs4Daez</title>
    <link rel="stylesheet" href="./css/style.css">
    
    <style>
    @media screen and (max-width: 768px) {
        header.main-header { height: auto !important; padding: 0 !important; }
        .main-nav { display: flex !important; flex-direction: column !important; align-items: center !important; padding: 25px 10px !important; gap: 12px !important; }
        .main-nav .logo img { width: 85% !important; max-width: 290px !important; }
        .main-nav nav { flex-direction: row !important; justify-content: center !important; gap: 14px !important; }
    }
    
    /* Button Styles */
    .btn-buy {
        background: #3f3f46 !important;
        color: #fff !important;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-buy.copied {
        background: var(--accent-color) !important;
        color: #000 !important;
    }

    .checkmark {
        font-weight: bold;
        color: #00ff00;
    }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="main-nav">
            <div class="logo">
                <a href="index.html">
                    <img src="./assets/images/logo.png" alt="Customs4Daez Logo">
                </a>
            </div>
            <nav>
                <a href="showroom.html">Showroom</a>
                <a href="free-overlays.html" class="active">Free Overlays</a>
                <a href="custom.html" class="nav-cta">Custom Request</a>
            </nav>
        </div>
    </header>

    <main style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
        
        <div class="section-title" style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-size: 2.5rem; color: #fff; text-transform: uppercase; letter-spacing: 1px;">
                Free <span style="color: #ff0000;">Overlays</span>
            </h1>
            <p style="color: #aaa; font-size: 1rem; margin-top: 10px;">
                Test out the performance in OBS instantly. Features a locked, non-removable on-screen watermark.
            </p>
        </div>

        <div class="store-grid">
            <div class="store-card">
                <div class="media-frame" style="background: #000; aspect-ratio: 16/9;">
                    <!-- Your preview content -->
                </div>
                <div class="card-info">
                    <h3>Classic White (Xbox Layout)</h3>
                    <div class="card-footer">
                        <span class="price" style="color: #fff;">FREE</span>
                        <button class="btn-buy" onclick="copyLink(this)">
                            Copy Link<span class="checkmark" style="display:none;"> ✔</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function copyLink(button) {
            const link = "https://yourname.github.io/file";
            const checkmark = button.querySelector('.checkmark');
            
            navigator.clipboard.writeText(link).then(() => {
                button.classList.add('copied');
                const textNode = button.childNodes[0];
                textNode.textContent = "Copied ";
                checkmark.style.display = 'inline';
                
                setTimeout(() => {
                    button.classList.remove('copied');
                    textNode.textContent = "Copy Link ";
                    checkmark.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
