<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Overlays | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        <div class="main-nav">
            <div class="logo">
                <a href="index.html">
                    <img src="./assets/images/logo.png" alt="Customs4Daez Logo">
                </a>
            </div>
            <nav>
                <a href="showroom.html">Showroom</a>
                <a href="free-overlays.html">Free Overlays</a>
                <a href="custom.html" class="nav-cta">Custom Request</a>
            </nav>
        </div>
    </header>

    <!-- Page Content -->
    <main class="section-container">
        <h2 style="text-align: center;">FREE OVERLAYS</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 40px;">
            Test out the performance in OBS instantly. Features a locked, non-removable on-screen watermark.
        </p>

        <div class="store-grid">
            <!-- Overlay Card -->
            <div class="store-card">
                <div class="media-frame" style="background: #111;">
                    <!-- Your preview content -->
                </div>
                <div class="card-info">
                    <h3>Classic White (Xbox Layout)</h3>
                    <div class="url-copy-box">
                        <input type="text" value="https://yourname.github.io/file" readonly>
                        <button onclick="copyToClipboard(this)">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function copyToClipboard(button) {
            const input = button.previousElementSibling;
            input.select();
            document.execCommand("copy");
            button.innerText = "Copied!";
            setTimeout(() => { button.innerText = "Copy"; }, 2000);
        }
    </script>
</body>
</html>
