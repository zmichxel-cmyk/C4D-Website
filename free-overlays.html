<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Overlays | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific header style to match Premium Showroom */
        .hero-text { text-align: center; margin-bottom: 40px; }
        .hero-text h2 { font-size: 3rem; font-weight: 900; color: #ffffff; text-transform: uppercase; }
        .hero-text h2 span { color: var(--accent-color); }
        .hero-text p { color: var(--text-muted); margin-top: 10px; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header class="main-header">
        <div class="main-nav">
            <div class="logo">
                <a href="index.html">
                    <img src="./assets/images/logo.png" alt="Customs4Daez Logo">
                </a>
            </div>
            <nav>
                <a href="showroom.html">Showroom</a>
                <a href="free-overlays.html">Free Overlays</a>
                <a href="custom.html" class="nav-cta">Custom Request</a>
            </nav>
        </div>
    </header>

    <!-- Page Content -->
    <main class="section-container">
        <div class="hero-text">
            <h2>FREE <span>OVERLAYS</span></h2>
            <p>Test out the performance in OBS instantly. Features a locked, non-removable on-screen watermark.</p>
        </div>

        <div class="store-grid">
            <!-- Overlay Card -->
            <div class="store-card">
                <div class="media-frame" style="background: #111;">
                    <!-- Your preview content -->
                </div>
                <div class="card-info">
                    <h3>Classic White (Xbox Layout)</h3>
                    <!-- Updated footer to match Showroom -->
                    <div class="card-footer">
                        <span class="price">FREE</span>
                        <button class="btn-buy" onclick="copyLink(this)">Copy Link</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function copyLink(button) {
            const link = "https://yourname.github.io/file";
            navigator.clipboard.writeText(link).then(() => {
                const originalText = button.innerText;
                button.innerText = "Copied!";
                setTimeout(() => { button.innerText = originalText; }, 2000);
            });
        }
    </script>
</body>
</html>
