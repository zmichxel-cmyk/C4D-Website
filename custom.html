<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Overlay Brief | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Form-specific overrides to ensure they match style.css variables */
        .form-container { padding: 40px 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #fff; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; background: #16161a; border: 1px solid #24242b; color: #fff; border-radius: 4px;
        }
        .btn-submit {
            background: #ff3344; color: #000; padding: 12px 24px; border: none; border-radius: 4px;
            font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; }
        
        @media screen and (max-width: 768px) {
            header.main-header { height: auto !important; padding: 0 !important; }
            .main-nav { display: flex !important; flex-direction: column !important; align-items: center !important; padding: 25px 10px !important; gap: 12px !important; }
            .main-nav .logo img { width: 85% !important; max-width: 290px !important; }
            .main-nav nav { flex-direction: row !important; justify-content: center !important; gap: 14px !important; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="main-nav">
            <div class="logo">
                <a href="index.html">
                    <img src="./assets/images/logo.png" alt="Customs4Daez Logo">
                </a>
            </div>
            <nav>
                <a href="showroom.html">Showroom</a>
                <a href="free-overlays.html">Free Overlays</a>
                <a href="custom.html" class="nav-cta">Custom Request</a>
            </nav>
        </div>
    </header>

    <main class="form-container">
        <div class="section-container" style="max-width: 600px; margin: 0 auto;">
            
            <h1 style="text-align: center; margin-bottom: 10px;">COMMISSION A CUSTOM DESIGN</h1>
            <p style="text-align: center; color: #a0a0aa; margin-bottom: 30px;">Fill out the design brief below. Custom assets start at a premium flat rate. Once submitted, I will review your details and send an upfront deposit link to secure your slot.</p>

            <form id="my-form" action="https://formspree.io/f/mdajwzky" method="POST" class="brief-form">
                <div class="form-group">
                    <label for="streamer-name">Twitch / Kick / YouTube Name</label>
                    <input type="text" id="streamer-name" name="streamer_name" placeholder="e.g., StreamerNameTV" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email Address</label>
                    <input type="email" id="email" name="email" placeholder="where I should send your invoice" required>
                </div>

                <div class="form-group">
                    <label for="controller-type">Controller Layout Style</label>
                    <select id="controller-type" name="controller_type" required>
                        <option value="" disabled selected>Select a layout...</option>
                        <option value="ps5">PlayStation 5 DualSense</option>
                        <option value="xbox">Xbox Series X/S</option>
                        <option value="gamecube">Nintendo GameCube</option>
                        <option value="arcade">Arcade Stick / Hitbox</option>
                        <option value="custom-hybrid">Other / Fully Custom Layout</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="colors">Color Palette & Aesthetic</label>
                    <input type="text" id="colors" name="colors" placeholder="e.g., Graffiti style, matte black with neon crimson accents" required>
                </div>

                <div class="form-group">
                    <label for="details">Specific Design Details & Features</label>
                    <textarea id="details" name="details" rows="6" placeholder="Describe any specific animations, glowing effects, custom fonts, or branding placements you want included..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Design Brief</button>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("my-form");
        async function handleSubmit(event) {
            event.preventDefault();
            const status = document.querySelector(".btn-submit");
            const data = new FormData(event.target);
            status.innerText = "Sending Brief...";
            status.disabled = true;

            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    window.location.href = "./success.html";
                } else {
                    alert("Oops! There was a problem submitting your form.");
                    status.innerText = "Submit Design Brief";
                    status.disabled = false;
                }
            }).catch(error => {
                alert("Oops! There was a connectivity problem.");
                status.innerText = "Submit Design Brief";
                status.disabled = false;
            });
        }
        form.addEventListener("submit", handleSubmit);
    </script>
</body>
</html>
