<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Overlay Brief | Customs4Daez</title>
    <link rel="stylesheet" href="css/style.css?v=7">

    <style>
    @media screen and (max-width: 768px) {
        /* 1. Smash the massive black empty space footprint */
        header.main-header {
            height: auto !important;
            min-height: unset !important;
            max-height: unset !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        /* 2. Force identical stacked column spacing */
        .main-nav {
            display: flex !important;
            flex-direction: column !important; 
            align-items: center !important;    
            justify-content: center !important;
            text-align: center !important;
            padding: 25px 10px 15px 10px !important; /* Matches home perfectly */
            width: 100% !important;
            box-sizing: border-box !important;
            gap: 12px !important;
        }

        /* 3. Hard-Center the Logo Box and Image Assets */
        .main-nav .logo {
            display: flex !important;
            justify-content: center !important; 
            align-items: center !important;
            width: 100% !important;
            margin: 0 auto !important;         
        }

        .main-nav .logo a {
            display: flex !important;
            justify-content: center !important; 
            align-items: center !important;
            width: 100% !important;
        }

        .main-nav .logo img {
            width: 85% !important;        
            max-width: 290px !important;  
            height: auto !important;       
            object-fit: contain !important;
            display: block !important;
            margin: 0 auto !important;     
        }

        /* 4. Keep Links Row Perfectly Centered Underneath */
        .main-nav nav {
            display: flex !important;
            flex-direction: row !important; 
            justify-content: center !important;
            align-items: center !important;
            gap: 14px !important;         
            width: 100% !important;
            margin: 0 auto !important;
        }

        .main-nav nav a {
            font-size: 0.8rem !important; 
            white-space: nowrap !important; 
            text-decoration: none !important;
            padding: 4px 2px !important;
        }

        .nav-cta {
            display: inline-block !important;
            padding: 5px 10px !important;
            border: 1px solid #ff0000 !important;
            border-radius: 4px !important;
        }
    }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="main-nav">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Logo">
                </a>
            </div>
            <nav>
                <a href="showroom.html">Showroom</a>
                <a href="free-overlays.html">Free Overlays</a>
                <a href="custom.html" class="nav-cta">Custom Request</a>
            </nav>
        </div>
    </header>

    <main class="form-container">
        <h1>COMMISSION A CUSTOM DESIGN</h1>
        <p class="form-intro">Fill out the design brief below. Custom assets start at a premium flat rate. Once submitted, I will review your details and send an upfront deposit link to secure your slot.</p>

        <form id="my-form" action="https://formspree.io/f/mdajwzky" method="POST" class="brief-form">
            
            <div class="form-group">
                <label for="streamer-name">Twitch / Kick / YouTube Name</label>
                <input type="text" id="streamer-name" name="streamer_name" placeholder="e.g., StreamerNameTV" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" placeholder="where I should send your invoice" required>
            </div>

            <div class="form-group">
                <label for="controller-type">Controller Layout Style</label>
                <select id="controller-type" name="controller_type" required>
                    <option value="" disabled selected>Select a layout...</option>
                    <option value="ps5">PlayStation 5 DualSense</option>
                    <option value="xbox">Xbox Series X/S</option>
                    <option value="gamecube">Nintendo GameCube</option>
                    <option value="arcade">Arcade Stick / Hitbox</option>
                    <option value="custom-hybrid">Other / Fully Custom Layout</option>
                </select>
            </div>

            <div class="form-group">
                <label for="colors">Color Palette & Aesthetic</label>
                <input type="text" id="colors" name="colors" placeholder="e.g., Graffiti style, matte black with neon crimson accents" required>
            </div>

            <div class="form-group">
                <label for="details">Specific Design Details & Features</label>
                <textarea id="details" name="details" rows="6" placeholder="Describe any specific animations, glowing effects, custom fonts, or branding placements you want included..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Design Brief</button>
        </form>
    </main>

<script>
const form = document.getElementById("my-form");

async function handleSubmit(event) {
  event.preventDefault();
  const status = document.querySelector(".btn-submit");
  const data = new FormData(event.target);
  
  status.innerText = "Sending Brief...";
  status.disabled = true;

  fetch(event.target.action, {
    method: form.method,
    body: data,
    headers: { 'Accept': 'application/json' }
  }).then(response => {
    if (response.ok) {
      window.location.href = "./success.html";
    } else {
      response.json().then(data => {
        alert("Oops! There was a problem submitting your form.");
        status.innerText = "Submit Design Brief";
        status.disabled = false;
      })
    }
  }).catch(error => {
    alert("Oops! There was a connectivity problem.");
    status.innerText = "Submit Design Brief";
    status.disabled = false;
  });
}

form.addEventListener("submit", handleSubmit);
</script>
   
</body>
</html>
